services:
  postgres:
    image: postgres:16
    container_name: cancha-postgres
    environment:
      POSTGRES_DB: cancha
      POSTGRES_USER: cancha
      POSTGRES_PASSWORD: cancha
    ports:
      - '5432:5432'
    volumes:
      - cancha-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cancha -d cancha']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cancha-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cancha
      DB_USER: cancha
      DB_PASSWORD: cancha
    ports:
      - '8080:8080'

volumes:
  cancha-pgdata:
