spring:
  application:
    name: cancha-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cancha}
    username: ${DB_USER:cancha}
    password: ${DB_PASSWORD:cancha}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

cancha:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:PT1H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}